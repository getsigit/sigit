[repo]
owner = "getsigit"
name = "sigit"
slug = "getsigit-sigit"

[agent]
login = "sigit-code-review"
display_name = "siGit Code Review"

[harvest]
state = "closed"
limit = 50
since = "2026-09-01"
agent = "sigit-code-review"
cadence = "weekly"
day_of_week = "Mon"
runs_dir = "~/.agents/skills/sigit-code-review-outer-loop/runs"
report_format = "markdown"
compare_previous = true

[review.reviewer_skill]
name = "sigit-code-review-outer-loop"
version = "1.0.0"

[review.author_skill]
name = "sigit-code-review-feedbacks-response"
version = "1.0.0"

[review.repo_guidance]
branch_rules = "{fix,feature,release}/*"
ci_gate = "CI"
watch_paths = ["src/**"]
ignore_paths = ["**/*.md", "**/*.txt", "docs/**", "vendor/**", ".github/**", "*.lock"]

[[guardrails.known_issues]]
pattern = "all_zero_summary"
source = "getsigit-sigit"
description = "Zero findings on a large control-flow diff may be recall loss from an over-corrected prompt bar, not a clean review. Seen on stack #163 (900 additions, 0 findings)."
action = "flag_in_report"

[[guardrails.known_issues]]
pattern = "confident_false_positives"
source = "getsigit-sigit"
description = "Confident declarative findings whose premise is contradicted by the cited code. Seen on stack #160 (5 of 5 findings rejected, rejected_rate 1.0). The hedge ban replaced speculative questions with confident wrong claims."
action = "flag_in_report"

[[guardrails.known_issues]]
pattern = "approval_on_disagree"
source = "getsigit-sigit"
description = "Agent approves within 30-45s of an author disagreement without processing the correction. Compounds with confident false positives: wrong claim, author corrects, agent approves without re-reading."
action = "flag_in_report"

[[guardrails.known_issues]]
pattern = "repeat_findings_high"
source = "getsigit-sigit-si"
description = "Repeat findings above 30% indicate the agent is re-raising issues the author already addressed."
action = "flag_in_report"

[[guardrails.known_issues]]
pattern = "force_pushes_inflate_rounds"
source = "smbcloudXYZ-smbcloud"
description = "Force pushes cause one-for-one review round inflation; the agent re-reads unchanged diffs."
action = "note_in_report"
