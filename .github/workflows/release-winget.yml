name: winget Release

# Dispatched by release-github.yml once the release and its checksums exist.
#
# winget manifests live in microsoft/winget-pkgs, and `wingetcreate update`
# only works on a package that is already there. So this workflow branches:
#
#   - package already in winget-pkgs -> `wingetcreate update`, which rewrites
#     the URLs and re-hashes the installers for us.
#   - package not there yet -> render the manifests in packaging/winget/ and
#     `wingetcreate submit` them as a new package.
#
# The second path only runs once, but keeping it here means a first release
# does not need someone to sit at a Windows box running `wingetcreate new`
# interactively.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.2)"
        required: true

concurrency:
  # A re-pushed or re-dispatched tag fires this a second time. Queue the
  # duplicate behind the original instead of cancelling it: cancelling a run
  # mid-publish can leave a channel half-uploaded, whereas a queued duplicate
  # just hits the "already published" check and exits clean.
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPO: getsigit/sigit
  PACKAGE_IDENTIFIER: getSigit.siGitCode

jobs:
  submit-winget-manifest:
    name: Submit winget manifest
    # wingetcreate is a Windows-only tool.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve tag, version and release date
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          # wingetcreate wants ReleaseDate as YYYY-MM-DD.
          DATE=$(gh release view "$TAG" --repo "$REPO" --json publishedAt --jq '.publishedAt[0:10]')

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Check whether the package is already in winget-pkgs
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # manifests are filed under the lowercased first letter of the
          # publisher, e.g. manifests/g/getSigit/siGitCode.
          PUBLISHER="${PACKAGE_IDENTIFIER%%.*}"
          NAME="${PACKAGE_IDENTIFIER#*.}"
          FIRST=$(echo "${PUBLISHER:0:1}" | tr '[:upper:]' '[:lower:]')
          PATH_IN_REPO="manifests/${FIRST}/${PUBLISHER}/${NAME}"

          # Branch on the status code, not on whether the request worked.
          # This used to treat any failure as "not there", so a GitHub outage
          # during the v1.7.7 run sent an existing package down the
          # new-package path and filed a bogus Package Request
          # (microsoft/winget-pkgs#465415). Only a 404 means "not there";
          # anything else fails the job before an issue or PR is opened, so a
          # rerun is safe.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/${PATH_IN_REPO}") || true

          case "$STATUS" in
            200)
              echo "Found ${PACKAGE_IDENTIFIER} at ${PATH_IN_REPO}; submitting an update."
              echo "found=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No ${PACKAGE_IDENTIFIER} at ${PATH_IN_REPO}; submitting it as a new package."
              echo "found=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected ${STATUS:-no response} from GitHub checking ${PATH_IN_REPO}; refusing to guess" >&2
              exit 1
              ;;
          esac

      - name: Render manifests for a first submission
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"

          mkdir -p artifacts manifests

          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "sigit-win-*.exe.sha256" \
            --dir artifacts/

          # The schema wants 64 hex characters; the community validation
          # pipeline writes them uppercase, so match that.
          SHA_AMD64=$(tr -d '[:space:]' < artifacts/sigit-win-amd64.exe.sha256 | tr '[:lower:]' '[:upper:]')
          SHA_ARM64=$(tr -d '[:space:]' < artifacts/sigit-win-arm64.exe.sha256 | tr '[:lower:]' '[:upper:]')

          RELEASE_DATE="${{ steps.release.outputs.date }}"

          for template in packaging/winget/*.yaml.in; do
            out="manifests/$(basename "$template" .in)"
            sed \
              -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@TAG@|${TAG}|g" \
              -e "s|@REPO@|${REPO}|g" \
              -e "s|@SHA_AMD64@|${SHA_AMD64}|g" \
              -e "s|@SHA_ARM64@|${SHA_ARM64}|g" \
              -e "s|@RELEASE_DATE@|${RELEASE_DATE}|g" \
              "$template" > "$out"

            echo "--- ${out} ---"
            cat "$out"
          done

      - name: Download wingetcreate
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      # winget-pkgs convention: file the "please add/update this package"
      # Package Request issue *first*, then open the manifest PR that fulfils
      # it with "Resolves #N". Doing it the other way round (PR first, issue
      # after) reads as "here's a request, and here's the PR that already did
      # it", posted seconds apart.
      #
      # The issue and the PR are authored by two separate PATs, configured as
      # the repo secrets WINGET_ISSUE_TOKEN (the Package Request issue) and
      # WINGET_PR_TOKEN (the manifest PR). Both need public_repo scope on
      # microsoft/winget-pkgs (fork + open issues/PRs). WINGET_PR_TOKEN also
      # needs read:org and read:discussion: the "Set the winget PR body" step
      # below calls `gh pr edit`, whose GraphQL query resolves org/team and
      # discussion fields and fails with a scope error without them.
      # WINGET_PR_TOKEN replaces the old single WINGET_TOKEN.
      - name: File the winget Package Request issue
        id: issue
        shell: bash
        env:
          # Authored by the issue account for this repo.
          GH_TOKEN: ${{ secrets.WINGET_ISSUE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "WINGET_ISSUE_TOKEN is not set. It needs a PAT (public_repo) for the account that should author the Package Request issue." >&2
            exit 1
          fi

          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"

          # The release assets, same URLs the update step feeds wingetcreate.
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          INSTALLER_AMD64="${BASE}/sigit-win-amd64.exe"
          INSTALLER_ARM64="${BASE}/sigit-win-arm64.exe"

          # winget-pkgs' Package Request is an issue *form*
          # (.github/ISSUE_TEMPLATE/package_request.yml): the title must be
          # "[Package Request]: ..." and the body has to carry the labelled
          # fields below (Installer Url especially — without it a maintainer
          # just replies "please provide the installer link"). A free-text
          # body lands as Needs-Triage and can't be acted on.
          ISSUE_BODY=$(cat <<EOF
          Download Page Url: https://github.com/${REPO}/releases/tag/${TAG}
          Publisher: getSigit
          Package Name: siGit Code
          Description: siGit Code, an AI coding agent that runs on your machine.
          Package Version: ${VERSION}
          Installer Url: ${INSTALLER_AMD64}
          Installer Url: ${INSTALLER_ARM64}
          EOF
          )

          ISSUE_URL=$(gh issue create \
            --repo microsoft/winget-pkgs \
            --title "[Package Request]: ${PACKAGE_IDENTIFIER} ${VERSION}" \
            --body "$ISSUE_BODY")

          echo "Opened issue ${ISSUE_URL}"
          echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Sebat dulu ...
        if: steps.issue.outputs.issue_number != ''
        shell: bash
        run: sleep $(( RANDOM % 61 + 150 ))

      - name: Submit new package
        id: submit_new
        if: steps.exists.outputs.found == 'false'
        shell: pwsh
        env:
          # wingetcreate reads the token from this variable. Passing it as
          # --token instead makes the tool warn that the token can end up in
          # logs, which on a shared runner is not a warning worth ignoring.
          # This is the PR-author account for this repo (see mapping above).
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "WINGET_PR_TOKEN is not set. It needs a PAT with public_repo, read:org, and read:discussion scopes so wingetcreate can fork microsoft/winget-pkgs and open the manifest PR, and gh can edit the PR body."
          }

          $version = "${{ steps.release.outputs.version }}"

          # Tee stdout so we can scrape the PR URL afterwards. wingetcreate
          # prints "Pull request can be found here: <url>" on success, and
          # that line is the only handle we get on the PR it just opened.
          # --no-open because the runner has no browser to open the PR in.
          .\wingetcreate.exe submit manifests `
            --prtitle "New package: $env:PACKAGE_IDENTIFIER version $version" `
            --no-open 2>&1 | Tee-Object -Variable output

          if ($LASTEXITCODE -ne 0) {
            Write-Error "wingetcreate submit failed with exit code $LASTEXITCODE"
          }

          $match = [regex]::Match(($output -join "`n"), 'https://github\.com/microsoft/winget-pkgs/pull/(\d+)')
          if ($match.Success) {
            "pr_url=$($match.Value)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pr_number=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "Could not find the PR URL in wingetcreate output; skipping issue linking."
          }

      - name: Submit manifest update
        id: submit_update
        if: steps.exists.outputs.found == 'true'
        shell: pwsh
        env:
          # PR-author account for this repo (see mapping above).
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "WINGET_PR_TOKEN is not set. It needs a PAT with public_repo, read:org, and read:discussion scopes so wingetcreate can fork microsoft/winget-pkgs and open the manifest PR, and gh can edit the PR body."
          }

          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $base = "https://github.com/${env:REPO}/releases/download/$tag"

          # The trailing |x64 and |arm64 tell wingetcreate which installer
          # entry each URL replaces. Without them it guesses from the file
          # name, and "sigit-win-amd64.exe" is not a spelling it recognises.
          .\wingetcreate.exe update $env:PACKAGE_IDENTIFIER `
            --version $version `
            --urls "$base/sigit-win-amd64.exe|x64" "$base/sigit-win-arm64.exe|arm64" `
            --release-notes-url "https://github.com/${env:REPO}/releases/tag/$tag" `
            --release-date "${{ steps.release.outputs.date }}" `
            --prtitle "Update $env:PACKAGE_IDENTIFIER to version $version" `
            --submit `
            --no-open 2>&1 | Tee-Object -Variable output

          if ($LASTEXITCODE -ne 0) {
            Write-Error "wingetcreate failed with exit code $LASTEXITCODE"
          }

          $match = [regex]::Match(($output -join "`n"), 'https://github\.com/microsoft/winget-pkgs/pull/(\d+)')
          if ($match.Success) {
            "pr_url=$($match.Value)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pr_number=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "Could not find the PR URL in wingetcreate output; skipping issue linking."
          }

      # wingetcreate has no --prbody flag (only --prtitle), so it always opens
      # the PR with the winget-pkgs template: an empty Description and an
      # unticked "Linked to an issue" box next to a "Resolves #[Issue Number]"
      # placeholder. The issue already exists (filed first, above), so this
      # step just rewrites the body to point the PR at it with "Resolves #N".
      #
      # This must run as the PR author (WINGET_PR_TOKEN) — the account that
      # opened the PR via wingetcreate — since only the author (or a repo
      # maintainer) can edit it.
      - name: Set the winget PR body and link the issue
        id: link
        if: >-
          (steps.submit_new.outputs.pr_number != '') ||
          (steps.submit_update.outputs.pr_number != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          set -euo pipefail

          PR_URL="${{ steps.submit_new.outputs.pr_url || steps.submit_update.outputs.pr_url }}"
          ISSUE_NUMBER="${{ steps.issue.outputs.issue_number }}"
          VERSION="${{ steps.release.outputs.version }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${{ steps.release.outputs.tag }}"

          if [ -n "$ISSUE_NUMBER" ]; then
            CHECKBOX="- [x] Linked to an issue (if applicable)"
            RESOLVES="- Resolves #${ISSUE_NUMBER}"
          else
            CHECKBOX="- [ ] Linked to an issue (if applicable)"
            RESOLVES=""
          fi

          if [ "${{ steps.exists.outputs.found }}" = "false" ]; then
            DESC="Adds ${PACKAGE_IDENTIFIER} version ${VERSION}. Release notes: ${RELEASE_URL}"
          else
            DESC="Updates ${PACKAGE_IDENTIFIER} to version ${VERSION}. Release notes: ${RELEASE_URL}"
          fi

          # Mirrors the current .github/PULL_REQUEST_TEMPLATE.md; keep the
          # checklist items in sync with it (e.g. the 1.12 schema line).
          BODY=$(cat <<EOF
          ## 📖 Description
          ${DESC}
          ## ✅ Checklist
          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
          ${CHECKBOX}
          ${RESOLVES}
          ## 📦 Manifest Checklist
          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated manifest locally with \`winget validate --manifest <directory>\`
          - [x] Tested manifest locally with \`winget install --manifest <directory>\`
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
          EOF
          )

          gh pr edit "$PR_URL" --body "$BODY"
          echo "Linked ${PR_URL} to issue #${ISSUE_NUMBER:-<none>}"
