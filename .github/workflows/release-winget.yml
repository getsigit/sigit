name: winget Release

# Dispatched by release-github.yml once the release and its checksums exist.
#
# winget manifests live in microsoft/winget-pkgs, and `wingetcreate update`
# only works on a package that is already there. So this workflow branches:
#
#   - package already in winget-pkgs -> `wingetcreate update`, which rewrites
#     the URLs and re-hashes the installers for us.
#   - package not there yet -> render the manifests in packaging/winget/ and
#     `wingetcreate submit` them as a new package.
#
# The second path only runs once, but keeping it here means a first release
# does not need someone to sit at a Windows box running `wingetcreate new`
# interactively.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.2)"
        required: true

concurrency:
  # A re-pushed or re-dispatched tag fires this a second time. Queue the
  # duplicate behind the original instead of cancelling it: cancelling a run
  # mid-publish can leave a channel half-uploaded, whereas a queued duplicate
  # just hits the "already published" check and exits clean.
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPO: getsigit/sigit
  PACKAGE_IDENTIFIER: getSigit.siGitCode

jobs:
  submit-winget-manifest:
    name: Submit winget manifest
    # wingetcreate is a Windows-only tool.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve tag, version and release date
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          # wingetcreate wants ReleaseDate as YYYY-MM-DD.
          DATE=$(gh release view "$TAG" --repo "$REPO" --json publishedAt --jq '.publishedAt[0:10]')

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Check whether the package is already in winget-pkgs
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # manifests are filed under the lowercased first letter of the
          # publisher, e.g. manifests/g/getSigit/siGitCode.
          PUBLISHER="${PACKAGE_IDENTIFIER%%.*}"
          NAME="${PACKAGE_IDENTIFIER#*.}"
          FIRST=$(echo "${PUBLISHER:0:1}" | tr '[:upper:]' '[:lower:]')
          PATH_IN_REPO="manifests/${FIRST}/${PUBLISHER}/${NAME}"

          if gh api "repos/microsoft/winget-pkgs/contents/${PATH_IN_REPO}" >/dev/null 2>&1; then
            echo "Found ${PACKAGE_IDENTIFIER} at ${PATH_IN_REPO}; submitting an update."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${PACKAGE_IDENTIFIER} at ${PATH_IN_REPO}; submitting it as a new package."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render manifests for a first submission
        if: steps.exists.outputs.found == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"

          mkdir -p artifacts manifests

          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "sigit-win-*.exe.sha256" \
            --dir artifacts/

          # The schema wants 64 hex characters; the community validation
          # pipeline writes them uppercase, so match that.
          SHA_AMD64=$(tr -d '[:space:]' < artifacts/sigit-win-amd64.exe.sha256 | tr '[:lower:]' '[:upper:]')
          SHA_ARM64=$(tr -d '[:space:]' < artifacts/sigit-win-arm64.exe.sha256 | tr '[:lower:]' '[:upper:]')

          RELEASE_DATE="${{ steps.release.outputs.date }}"

          for template in packaging/winget/*.yaml.in; do
            out="manifests/$(basename "$template" .in)"
            sed \
              -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@TAG@|${TAG}|g" \
              -e "s|@REPO@|${REPO}|g" \
              -e "s|@SHA_AMD64@|${SHA_AMD64}|g" \
              -e "s|@SHA_ARM64@|${SHA_ARM64}|g" \
              -e "s|@RELEASE_DATE@|${RELEASE_DATE}|g" \
              "$template" > "$out"

            echo "--- ${out} ---"
            cat "$out"
          done

      - name: Download wingetcreate
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit new package
        id: submit_new
        if: steps.exists.outputs.found == 'false'
        shell: pwsh
        env:
          # wingetcreate reads the token from this variable. Passing it as
          # --token instead makes the tool warn that the token can end up in
          # logs, which on a shared runner is not a warning worth ignoring.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "WINGET_TOKEN is not set. It needs a PAT with public_repo scope so wingetcreate can fork microsoft/winget-pkgs and open the manifest PR."
          }

          $version = "${{ steps.release.outputs.version }}"

          # Tee stdout so we can scrape the PR URL afterwards. wingetcreate
          # prints "Pull request can be found here: <url>" on success, and
          # that line is the only handle we get on the PR it just opened.
          # --no-open because the runner has no browser to open the PR in.
          .\wingetcreate.exe submit manifests `
            --prtitle "New package: $env:PACKAGE_IDENTIFIER version $version" `
            --no-open 2>&1 | Tee-Object -Variable output

          if ($LASTEXITCODE -ne 0) {
            Write-Error "wingetcreate submit failed with exit code $LASTEXITCODE"
          }

          $match = [regex]::Match(($output -join "`n"), 'https://github\.com/microsoft/winget-pkgs/pull/(\d+)')
          if ($match.Success) {
            "pr_url=$($match.Value)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pr_number=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "Could not find the PR URL in wingetcreate output; skipping issue linking."
          }

      - name: Submit manifest update
        id: submit_update
        if: steps.exists.outputs.found == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Error "WINGET_TOKEN is not set. It needs a PAT with public_repo scope so wingetcreate can fork microsoft/winget-pkgs and open the manifest PR."
          }

          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $base = "https://github.com/${env:REPO}/releases/download/$tag"

          # The trailing |x64 and |arm64 tell wingetcreate which installer
          # entry each URL replaces. Without them it guesses from the file
          # name, and "sigit-win-amd64.exe" is not a spelling it recognises.
          .\wingetcreate.exe update $env:PACKAGE_IDENTIFIER `
            --version $version `
            --urls "$base/sigit-win-amd64.exe|x64" "$base/sigit-win-arm64.exe|arm64" `
            --release-notes-url "https://github.com/${env:REPO}/releases/tag/$tag" `
            --release-date "${{ steps.release.outputs.date }}" `
            --prtitle "Update $env:PACKAGE_IDENTIFIER to version $version" `
            --submit `
            --no-open 2>&1 | Tee-Object -Variable output

          if ($LASTEXITCODE -ne 0) {
            Write-Error "wingetcreate failed with exit code $LASTEXITCODE"
          }

          $match = [regex]::Match(($output -join "`n"), 'https://github\.com/microsoft/winget-pkgs/pull/(\d+)')
          if ($match.Success) {
            "pr_url=$($match.Value)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "pr_number=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "Could not find the PR URL in wingetcreate output; skipping issue linking."
          }

      # wingetcreate has no --prbody flag, so it always opens the PR with the
      # winget-pkgs template: an empty Description and an unticked
      # "Linked to an issue" box next to a "Resolves #[Issue Number]"
      # placeholder. We used to tick that box and fill in the issue number by
      # hand after every release. This step does it instead.
      #
      # On a first submission it also files the Package Request issue the
      # linkable number comes from. Updates to an existing package don't need
      # one (the checkbox is "if applicable"), so there we just fill the
      # Description.
      - name: Link the winget PR to a Package Request issue
        id: link
        if: >-
          (steps.submit_new.outputs.pr_number != '') ||
          (steps.submit_update.outputs.pr_number != '')
        shell: bash
        env:
          # The PR and the issue both live in microsoft/winget-pkgs, which the
          # default GITHUB_TOKEN can't write to. Reuse the wingetcreate PAT,
          # which already has the scope to open PRs there.
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail

          PR_URL="${{ steps.submit_new.outputs.pr_url || steps.submit_update.outputs.pr_url }}"
          NEW_PACKAGE="${{ steps.exists.outputs.found == 'false' }}"
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"

          ISSUE_NUMBER=""
          if [ "$NEW_PACKAGE" = "true" ]; then
            ISSUE_URL=$(gh issue create \
              --repo microsoft/winget-pkgs \
              --title "Package Request: ${PACKAGE_IDENTIFIER} ${VERSION}" \
              --body "Request to add ${PACKAGE_IDENTIFIER} version ${VERSION} to the Windows Package Manager Community Repository. Installers come from ${TAG} of ${REPO}.")
            echo "Opened issue ${ISSUE_URL}"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi

          # Rewrite the template body: fill the Description, tick the issue
          # box when we have an issue, and drop in the real number (or remove
          # the placeholder line on updates that aren't linked to anything).
          if [ -n "$ISSUE_NUMBER" ]; then
            CHECKBOX="- [x] Linked to an issue (if applicable)"
            RESOLVES="- Resolves #${ISSUE_NUMBER}"
            DESC="Adds ${PACKAGE_IDENTIFIER} version ${VERSION} from ${TAG}."
          else
            CHECKBOX="- [ ] Linked to an issue (if applicable)"
            RESOLVES=""
            DESC="Updates ${PACKAGE_IDENTIFIER} to version ${VERSION} from ${TAG}."
          fi

          BODY=$(cat <<EOF
          ## 📖 Description
          ${DESC}
          ## ✅ Checklist
          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
          ${CHECKBOX}
          ${RESOLVES}
          ## 📦 Manifest Checklist
          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated manifest locally with \`winget validate\`
          - [x] Tested manifest locally with \`winget install\`
          EOF
          )

          gh pr edit "$PR_URL" --body "$BODY"
          echo "Linked ${PR_URL} to issue #${ISSUE_NUMBER:-<none>}"
