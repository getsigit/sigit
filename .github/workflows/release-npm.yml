name: NPM Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true

concurrency:
  # A re-pushed or re-dispatched tag fires this a second time. Queue the
  # duplicate behind the original instead of cancelling it: cancelling a run
  # mid-publish can leave a channel half-uploaded, whereas a queued duplicate
  # just hits the "already published" check and exits clean.
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-npm-binaries:
    name: Publish NPM platform packages
    runs-on: ${{ matrix.build.OS }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: linux-x64-glibc,
              OS: ubuntu-latest,
              TARGET: x86_64-unknown-linux-gnu,
            }
          - {
              NAME: linux-arm64-glibc,
              OS: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-gnu,
            }
          - {
              NAME: win32-x64-msvc,
              OS: windows-2022,
              TARGET: x86_64-pc-windows-msvc,
            }
          - {
              NAME: win32-arm64-msvc,
              OS: windows-2022,
              TARGET: aarch64-pc-windows-msvc,
            }
          - { NAME: darwin-x64, OS: macos-26, TARGET: x86_64-apple-darwin }
          - { NAME: darwin-arm64, OS: macos-26, TARGET: aarch64-apple-darwin }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set the release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${{ github.event.inputs.tag }}"
            release_version="${release_version#v}"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Read Rust toolchain
        shell: bash
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$rust_toolchain" ]; then
            echo "Failed to read Rust toolchain from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_TOOLCHAIN=${rust_toolchain}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.build.TARGET }} --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup target list --installed

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: npm-${{ matrix.build.TARGET }}

      - name: Build binary
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.build.TARGET }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. .nvmrc pins the Node
      # version (>= 22.14.0, also an OIDC requirement); npm still needs
      # upgrading past whatever ships with it.
      - name: Upgrade npm for Trusted Publishing
        shell: bash
        run: npm install -g npm@latest

      # Authentication is OIDC: each @getsigit/* and @smbcloud/* package has a
      # Trusted Publisher pointing at this workflow, so there is no token to
      # leak. @smbcloud is the pre-1.5.5 scope, published alongside @getsigit
      # so that an install made before the rename keeps updating.
      - name: Publish platform package to NPM
        shell: bash
        run: |
          cd npm

          # Binary name from Cargo.toml
          cargo_bin="sigit"

          # Prefix used for optional dependency package names
          node_pkg_prefix="sigit"

          # Derive OS and architecture from the build matrix name
          # Matrix name format: <os>-<arch>[-<extra>]
          node_os=$(echo "${{ matrix.build.NAME }}" | cut -d '-' -f1)
          export node_os
          node_arch=$(echo "${{ matrix.build.NAME }}" | cut -d '-' -f2)
          export node_arch

          # Set the version
          export node_version="${{ env.RELEASE_VERSION }}"

          # Build the platform package name; normalise win32 → windows
          if [ "${{ matrix.build.OS }}" = "windows-2022" ]; then
            export node_pkg="${node_pkg_prefix}-windows-${node_arch}"
          else
            export node_pkg="${node_pkg_prefix}-${node_os}-${node_arch}"
          fi

          # Create the package directory
          mkdir -p "${node_pkg}/bin"

          # Windows binaries carry a .exe extension
          if [ "${{ matrix.build.OS }}" = "windows-2022" ]; then
            cargo_bin="${cargo_bin}.exe"
          fi

          cp "../target/${{ matrix.build.TARGET }}/release/${cargo_bin}" "${node_pkg}/bin"

          # One binary, published under both scopes: re-render package.json and
          # README for each, from the same directory.
          for scope in "@getsigit" "@smbcloud"; do
            node ./scripts/render-platform-package.cjs \
              "${node_pkg}" \
              "${node_version}" \
              "${node_os}" \
              "${node_arch}" \
              "${scope}"

            npm_package_name="${scope}/${node_pkg}"

            # `npm view` exits non-zero both when the version is genuinely
            # unpublished and when the registry could not be reached, so treat
            # only an E404 as "not published yet". Anything else stops the job
            # instead of publishing over a version that is already there.
            if view_output=$(npm view "${npm_package_name}@${node_version}" version 2>&1); then
              echo "${npm_package_name}@${node_version} already exists on npm, skipping publish"
              continue
            elif ! grep -q "E404" <<<"${view_output}"; then
              echo "npm view failed while checking ${npm_package_name}@${node_version}:" >&2
              echo "${view_output}" >&2
              exit 1
            fi

            (cd "${node_pkg}" && npm publish --access public)
          done

  publish-npm-base:
    name: Publish base NPM packages (@getsigit/sigit, @smbcloud/sigit)
    needs: publish-npm-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set the release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${{ github.event.inputs.tag }}"
            release_version="${release_version#v}"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. .nvmrc pins the Node
      # version (>= 22.14.0, also an OIDC requirement); npm still needs
      # upgrading past whatever ships with it.
      - name: Upgrade npm for Trusted Publishing
        shell: bash
        run: npm install -g npm@latest

      - name: Publish base packages to NPM
        shell: bash
        run: |
          cd npm/sigit

          npm_package_version="${{ env.RELEASE_VERSION }}"

          # Rewrite package.json with the correct release version and matching
          # optionalDependency versions, then build. The compiled launcher is
          # scope-agnostic — it reads its own package.json at runtime to decide
          # which scope to resolve the platform binary from — so both packages
          # ship the same lib/ and it only needs building once.
          node ../scripts/render-main-package.cjs \
            "./package.json" \
            "${npm_package_version}"

          npm install
          npm run build

          # @getsigit/sigit is the canonical package; @smbcloud/sigit is the
          # pre-1.5.5 name, kept publishing so installs predating the rename
          # keep updating. Its template points optionalDependencies at the
          # @smbcloud platform packages.
          for template in "package-main.json.tmpl" "package-compat.json.tmpl"; do
            node ../scripts/render-main-package.cjs \
              "./package.json" \
              "${npm_package_version}" \
              "${template}"

            npm_package_name=$(node -p "require('./package.json').name")

            # Same E404-only reading as the platform packages above: a registry
            # failure must not look like an unpublished version.
            if view_output=$(npm view "${npm_package_name}@${npm_package_version}" version 2>&1); then
              echo "${npm_package_name}@${npm_package_version} already exists on npm, skipping publish"
              continue
            elif ! grep -q "E404" <<<"${view_output}"; then
              echo "npm view failed while checking ${npm_package_name}@${npm_package_version}:" >&2
              echo "${view_output}" >&2
              exit 1
            fi

            npm publish --access public
          done
